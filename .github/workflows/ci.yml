name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-gate:
    name: Fast / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Compiler versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Package policy
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*dflags.*-preview=' dub.sdl; then
            echo "Preview compiler switches must not be package-wide dflags."
            false
          fi

      - name: Unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: Unit tests with DIP1000
        shell: bash
        run: DFLAGS="-unittest -preview=dip1000" dub test --compiler="$DC" --force

      - name: External consumer smoke
        shell: bash
        run: dub run --root=tests/consumer --compiler="$DC" --force

      - name: External consumer smoke with DIP1000
        shell: bash
        run: DFLAGS="-preview=dip1000" dub run --root=tests/consumer --compiler="$DC" --force


      - name: StaticVector research consumer
        shell: bash
        run: dub run --root=tests/research-static-vector-consumer --compiler="$DC" --force

      - name: StaticVector research consumer with DIP1000
        shell: bash
        run: DFLAGS="-preview=dip1000" dub run --root=tests/research-static-vector-consumer --compiler="$DC" --force

      - name: StaticVector promotion consumer
        shell: bash
        run: dub run --root=tests/static-vector-consumer --compiler="$DC" --force

      - name: StaticVector promotion consumer with DIP1000
        shell: bash
        run: DFLAGS="-preview=dip1000" dub run --root=tests/static-vector-consumer --compiler="$DC" --force

      - name: StaticVector lifecycle qualification
        shell: bash
        run: dub run --root=tests/static-vector-lifecycle --compiler="$DC" --force


      - name: StaticVector adversarial reference model
        shell: bash
        run: dub run --root=tests/static-vector-adversarial --compiler="$DC" --force

      - name: StaticVector GC reachability
        shell: bash
        run: dub run --root=tests/static-vector-gc --compiler="$DC" --force



      - name: Runtime GC reachability
        shell: bash
        run: dub run --root=tests/gc-reachability --compiler="$DC" --force


      - name: Inline storage GC reachability
        shell: bash
        run: dub run --root=tests/inline-storage-gc --compiler="$DC" --force

      - name: DIP1000 borrowed-slice negative compile
        shell: bash
        run: |
          for root in \
            tests/compile-negative/segment-escape \
            tests/compile-negative/runtime-segment-escape \
            tests/compile-negative/static-vector-slice-escape \
            tests/compile-negative/static-vector-ref-escape
          do
            if DFLAGS="-preview=dip1000" dub build \
                --root="$root" \
                --compiler="$DC" \
                --force; then
              echo "Expected borrowed storage escape to fail under DIP1000: $root"
              false
            fi
          done

      - name: StaticVector transfer negative compile
        shell: bash
        run: |
          for root in \
            tests/compile-negative/static-vector-move-only-copy \
            tests/compile-negative/static-vector-nontrivial-assign
          do
            if dub build \
                --root="$root" \
                --compiler="$DC" \
                --force; then
              echo "Expected invalid StaticVector transfer to fail: $root"
              false
            fi
          done

      - name: Documentation build
        if: startsWith(matrix.compiler, 'dmd-')
        shell: bash
        run: dub build --build=docs --compiler="$DC" --force

      - name: Release build
        shell: bash
        run: dub build --build=release --compiler="$DC" --force
