name: M7 BlockingQueue Synchronization Cost

on:
  pull_request:
    branches:
      - develop
    paths:
      - source/containers/research/blocking_queue.d
      - benchmarks/blocking_queue_sync_cost_probe.d
      - .github/workflows/blocking-queue-sync-cost.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-cost:
    name: BlockingQueue sync cost / ${{ matrix.arch }} / LDC 1.41
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0

      - name: Verify qualification host
        shell: bash
        run: |
          "$DC" --version
          uname -a
          lscpu
          test "$(uname -m)" = "${{ matrix.arch }}"
          test "$(nproc)" -ge 2

      - name: Build synchronization-cost probe
        shell: bash
        run: |
          mkdir -p build/m7-blocking-sync

          "$DC" \
            -O3 \
            -release \
            -boundscheck=off \
            -Isource \
            -of=build/m7-blocking-sync/probe \
            benchmarks/blocking_queue_sync_cost_probe.d \
            source/containers/research/blocking_queue.d \
            source/containers/runtime_ring_buffer.d \
            source/containers/internal/ring_sequence.d \
            source/containers/internal/runtime_storage.d \
            source/containers/internal/element_lifetime.d

      - name: Run synchronization-cost probe
        shell: bash
        run: |
          RESULTS=build/m7-blocking-sync/results.txt

          build/m7-blocking-sync/probe | tee "$RESULTS"

          # Diagnostic guard only. More than 25% paired-median overhead against
          # the same Mutex/Condition semantics requires investigation.
          awk 'BEGIN { bad = 0 }
               /ratio=/ {
                 split($0, parts, "ratio=");
                 ratio = parts[2] + 0.0;
                 if (ratio > 1.25) bad = 1;
               }
               END { exit bad }' "$RESULTS"

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: m7-blocking-sync-${{ matrix.arch }}
          path: build/m7-blocking-sync/results.txt
          if-no-files-found: error
