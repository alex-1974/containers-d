name: StaticVector Expansion Probe

on:
  pull_request:
    branches:
      - develop
    paths:
      - benchmarks/static_vector_expansion_probe.d
      - source/containers/internal/static_vector.d
      - source/containers/internal/inline_storage.d
      - source/containers/internal/element_lifetime.d
      - .github/workflows/perf-static-vector-expansion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instruction-counts:
    name: Expansion Buffer Ir / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Install Callgrind
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build probe
        shell: bash
        run: |
          mkdir -p build/perf-static-vector

          case "${{ matrix.compiler }}" in
            dmd-*)
              "$DC" \
                -O \
                -release \
                -inline \
                -boundscheck=off \
                -Isource \
                -of=build/perf-static-vector/static-vector-expansion-probe \
                benchmarks/static_vector_expansion_probe.d \
                source/containers/internal/static_vector.d \
                source/containers/internal/inline_storage.d \
                source/containers/internal/element_lifetime.d
              ;;
            ldc-*)
              "$DC" \
                -O3 \
                -release \
                -boundscheck=off \
                -Isource \
                -of=build/perf-static-vector/static-vector-expansion-probe \
                benchmarks/static_vector_expansion_probe.d \
                source/containers/internal/static_vector.d \
                source/containers/internal/inline_storage.d \
                source/containers/internal/element_lifetime.d
              ;;
          esac

          "$DC" --version

      - name: Verify semantic equivalence
        shell: bash
        run: |
          BIN=build/perf-static-vector/static-vector-expansion-probe
          ROUNDS=4096

          for capacity in 1 2 3 4; do
            baseline=$("$BIN" baseline "$capacity" "$ROUNDS" | awk '{print $3}')
            candidate=$("$BIN" candidate "$capacity" "$ROUNDS" | awk '{print $3}')
            echo "capacity=$capacity baseline=$baseline candidate=$candidate"
            test "$baseline" = "$candidate"
          done

      - name: Measure retired instructions
        shell: bash
        run: |
          BIN=build/perf-static-vector/static-vector-expansion-probe
          ROUNDS=262144
          RESULTS=build/perf-static-vector/results.tsv

          printf 'compiler\tcapacity\tvariant\trounds\tIr\tchecksum\n' > "$RESULTS"

          measure() {
            capacity="$1"
            variant="$2"
            symbol="bench_${variant}_${capacity}"
            out="build/perf-static-vector/callgrind-${variant}-${capacity}.out"

            checksum=$("$BIN" "$variant" "$capacity" "$ROUNDS" | awk '{print $3}')

            valgrind \
              --tool=callgrind \
              --collect-atstart=no \
              --toggle-collect="$symbol" \
              --callgrind-out-file="$out" \
              "$BIN" "$variant" "$capacity" "$ROUNDS" \
              >/dev/null 2>&1

            ir=$(awk '/^summary:/ {print $2}' "$out")

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${{ matrix.compiler }}" \
              "$capacity" \
              "$variant" \
              "$ROUNDS" \
              "$ir" \
              "$checksum" \
              >> "$RESULTS"
          }

          for capacity in 1 2 3 4; do
            measure "$capacity" baseline
            measure "$capacity" candidate
          done

          cat "$RESULTS"

          {
            echo '### ${{ matrix.compiler }} — StaticVector vs ExpansionBuffer'
            echo
            echo '| Capacity | Baseline Ir | Candidate Ir | Delta | Delta % |'
            echo '|---:|---:|---:|---:|---:|'
            for capacity in 1 2 3 4; do
              baseline=$(awk -F '\t' -v c="$capacity" '$2 == c && $3 == "baseline" {print $5}' "$RESULTS")
              candidate=$(awk -F '\t' -v c="$capacity" '$2 == c && $3 == "candidate" {print $5}' "$RESULTS")
              awk -v c="$capacity" -v b="$baseline" -v a="$candidate" 'BEGIN {
                delta = a - b;
                pct = b == 0 ? 0 : delta * 100.0 / b;
                printf "| %d | %d | %d | %+d | %+.6f%% |\n", c, b, a, delta, pct;
              }'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe evidence
        uses: actions/upload-artifact@v6
        with:
          name: static-vector-expansion-${{ matrix.compiler }}
          path: |
            build/perf-static-vector/results.tsv
            build/perf-static-vector/callgrind-*.out
          if-no-files-found: error
