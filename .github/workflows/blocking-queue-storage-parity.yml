name: M7 BlockingQueue Storage Parity

on:
  pull_request:
    branches:
      - develop
    paths:
      - source/containers/research/blocking_queue.d
      - benchmarks/blocking_queue_storage_parity_probe.d
      - .github/workflows/blocking-queue-storage-parity.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retired-instructions:
    name: BlockingQueue storage Ir / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Install Callgrind
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build storage parity probe
        shell: bash
        run: |
          mkdir -p build/m7-blocking-storage

          case "${{ matrix.compiler }}" in
            dmd-*)
              "$DC" \
                -O \
                -release \
                -inline \
                -boundscheck=off \
                -Isource \
                -of=build/m7-blocking-storage/probe \
                benchmarks/blocking_queue_storage_parity_probe.d \
                source/containers/runtime_ring_buffer.d \
                source/containers/internal/ring_sequence.d \
                source/containers/internal/runtime_storage.d \
                source/containers/internal/element_lifetime.d
              ;;
            ldc-*)
              "$DC" \
                -O3 \
                -release \
                -boundscheck=off \
                -Isource \
                -of=build/m7-blocking-storage/probe \
                benchmarks/blocking_queue_storage_parity_probe.d \
                source/containers/runtime_ring_buffer.d \
                source/containers/internal/ring_sequence.d \
                source/containers/internal/runtime_storage.d \
                source/containers/internal/element_lifetime.d
              ;;
          esac

      - name: Verify semantic parity
        shell: bash
        run: |
          BIN=build/m7-blocking-storage/probe
          ROUNDS=4096

          for probeRounds in 1 2 3 4 63 64 65 "$ROUNDS"
          do
            verify=$("$BIN" verify "$probeRounds" | awk '{print $2}')
            candidate=$("$BIN" candidate "$probeRounds" | awk '{print $2}')
            manual=$("$BIN" manual "$probeRounds" | awk '{print $2}')

            echo "rounds=$probeRounds verify=$verify candidate=$candidate manual=$manual"

            test "$verify" != "18446744073709551615"
            test "$verify" = "$candidate"
            test "$candidate" = "$manual"

            candidate_push=$("$BIN" candidate-push "$probeRounds" | awk '{print $2}')
            manual_push=$("$BIN" manual-push "$probeRounds" | awk '{print $2}')
            candidate_pop=$("$BIN" candidate-pop "$probeRounds" | awk '{print $2}')
            manual_pop=$("$BIN" manual-pop "$probeRounds" | awk '{print $2}')

            echo "rounds=$probeRounds push candidate=$candidate_push manual=$manual_push"
            echo "rounds=$probeRounds pop candidate=$candidate_pop manual=$manual_pop"

            test "$candidate_push" = "$manual_push"
            test "$candidate_pop" = "$manual_pop"
          done

      - name: Measure storage composition
        shell: bash
        run: |
          BIN=build/m7-blocking-storage/probe
          ROUNDS=65536
          RESULTS=build/m7-blocking-storage/results.tsv

          printf 'compiler\tvariant\trounds\tIr\tchecksum\n' > "$RESULTS"

          measure() {
            variant="$1"
            symbol="$2"
            out="build/m7-blocking-storage/callgrind-${variant}.out"

            checksum=$("$BIN" "$variant" "$ROUNDS" | awk '{print $2}')

            valgrind \
              --tool=callgrind \
              --collect-atstart=no \
              --toggle-collect="$symbol" \
              --callgrind-out-file="$out" \
              "$BIN" "$variant" "$ROUNDS" \
              >/dev/null 2>&1

            ir=$(awk '/^summary:/ {print $2}' "$out")

            printf '%s\t%s\t%s\t%s\t%s\n' \
              "${{ matrix.compiler }}" "$variant" "$ROUNDS" "$ir" "$checksum" \
              >> "$RESULTS"
          }

          measure candidate bench_candidate
          measure manual bench_manual
          measure candidate-push bench_candidate_push_only
          measure manual-push bench_manual_push_only
          measure candidate-pop bench_candidate_pop_only
          measure manual-pop bench_manual_pop_only

          cat "$RESULTS"

          compare_pair() {
            candidate_name="$1"
            manual_name="$2"
            label="$3"

            candidate=$(awk -F '\t' -v v="$candidate_name" '$2 == v {print $4}' "$RESULTS")
            manual=$(awk -F '\t' -v v="$manual_name" '$2 == v {print $4}' "$RESULTS")

            awk -v label="$label" -v c="$candidate" -v m="$manual" 'BEGIN {
              delta = c - m;
              pct = m == 0 ? 0 : delta * 100.0 / m;
              printf "%s manual Ir=%d candidate Ir=%d delta=%+d (%+.6f%%)\n", label, m, c, delta, pct;
            }'
          }

          compare_pair candidate manual combined
          compare_pair candidate-push manual-push push
          compare_pair candidate-pop manual-pop pop

          candidate=$(awk -F '\t' '$2 == "candidate" {print $4}' "$RESULTS")
          manual=$(awk -F '\t' '$2 == "manual" {print $4}' "$RESULTS")

          awk -v c="$candidate" -v m="$manual" 'BEGIN {
            delta = c - m;
            pct = m == 0 ? 0 : delta * 100.0 / m;

            # Research guard only. Any material delta is investigated before
            # production; fail here only on an obviously off-class result.
            if (pct > 15.0)
              exit 1;
          }'

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: m7-blocking-storage-${{ matrix.compiler }}
          path: |
            build/m7-blocking-storage/results.tsv
            build/m7-blocking-storage/callgrind-*.out
          if-no-files-found: error
