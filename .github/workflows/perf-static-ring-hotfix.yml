name: Static Ring Hotfix Performance

on:
  pull_request:
    branches:
      - main
    paths:
      - source/containers/ring_buffer.d
      - benchmarks/static_ring_overalignment_perf_probe.d
      - benchmarks/static_ring_overalignment_perf_reference.cpp
      - .github/workflows/perf-static-ring-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-ring-hotfix-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instruction-counts:
    name: Hotfix Ir / ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DMD 2.111.0
            compiler: dmd-2.111.0
          - name: DMD 2.113.0
            compiler: dmd-2.113.0
          - name: LDC 1.41.0
            compiler: ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Install Callgrind
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build D and C++ probes
        shell: bash
        run: |
          mkdir -p build/perf-static-ring-hotfix

          case "${{ matrix.compiler }}" in
            dmd-*)
              "$DC" \
                -O \
                -release \
                -inline \
                -boundscheck=off \
                -Isource \
                -of=build/perf-static-ring-hotfix/d-probe \
                benchmarks/static_ring_overalignment_perf_probe.d \
                source/containers/package.d \
                source/containers/ring_buffer.d
              ;;
            ldc-*)
              "$DC" \
                -O3 \
                -release \
                -boundscheck=off \
                -Isource \
                -of=build/perf-static-ring-hotfix/d-probe \
                benchmarks/static_ring_overalignment_perf_probe.d \
                source/containers/package.d \
                source/containers/ring_buffer.d
              ;;
          esac

          git worktree add --detach build/v010 v0.1.0

          case "${{ matrix.compiler }}" in
            dmd-*)
              "$DC" \
                -O \
                -release \
                -inline \
                -boundscheck=off \
                -Ibuild/v010/source \
                -of=build/perf-static-ring-hotfix/d-v010-probe \
                benchmarks/static_ring_overalignment_perf_probe.d \
                build/v010/source/containers/package.d \
                build/v010/source/containers/ring_buffer.d
              ;;
            ldc-*)
              "$DC" \
                -O3 \
                -release \
                -boundscheck=off \
                -Ibuild/v010/source \
                -of=build/perf-static-ring-hotfix/d-v010-probe \
                benchmarks/static_ring_overalignment_perf_probe.d \
                build/v010/source/containers/package.d \
                build/v010/source/containers/ring_buffer.d
              ;;
          esac

          clang++ \
            -std=c++20 \
            -O3 \
            -DNDEBUG \
            -fno-exceptions \
            -fno-rtti \
            benchmarks/static_ring_overalignment_perf_reference.cpp \
            -o build/perf-static-ring-hotfix/cpp-probe

      - name: Verify semantic equivalence
        shell: bash
        run: |
          D=build/perf-static-ring-hotfix/d-probe
          D_BASE=build/perf-static-ring-hotfix/d-v010-probe
          CPP=build/perf-static-ring-hotfix/cpp-probe
          ROUNDS=4096

          d_model=$("$D" model "$ROUNDS" | awk '{print $2}')
          d_normal=$("$D" normal "$ROUNDS" | awk '{print $2}')
          d_over=$("$D" over "$ROUNDS" | awk '{print $2}')
          cpp_normal=$("$CPP" normal "$ROUNDS" | awk '{print $2}')
          cpp_native=$("$CPP" native "$ROUNDS" | awk '{print $2}')
          cpp_dynamic=$("$CPP" dynamic "$ROUNDS" | awk '{print $2}')

          test "$d_model" = "$cpp_normal"
          test "$d_normal" = "$d_model"
          test "$d_over" = "$d_model"
          test "$d_normal" = "$cpp_native"
          test "$d_normal" = "$cpp_dynamic"

          base_normal=$("$D_BASE" normal "$ROUNDS" | awk '{print $2}')
          test "$base_normal" = "$d_model"

      - name: Measure retired instructions
        shell: bash
        run: |
          D=build/perf-static-ring-hotfix/d-probe
          D_BASE=build/perf-static-ring-hotfix/d-v010-probe
          CPP=build/perf-static-ring-hotfix/cpp-probe
          ROUNDS=262144
          RESULTS=build/perf-static-ring-hotfix/results.tsv

          printf 'toolchain\tvariant\trounds\tIr\tchecksum\n' > "$RESULTS"

          measure() {
            toolchain="$1"
            binary="$2"
            variant="$3"
            symbol="$4"
            out="build/perf-static-ring-hotfix/callgrind-${toolchain}-${variant}.out"

            checksum=$("$binary" "$variant" "$ROUNDS" | awk '{print $2}')

            valgrind \
              --tool=callgrind \
              --collect-atstart=no \
              --toggle-collect="$symbol" \
              --callgrind-out-file="$out" \
              "$binary" "$variant" "$ROUNDS" \
              >/dev/null 2>&1

            ir=$(awk '/^summary:/ {print $2}' "$out")
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$toolchain" "$variant" "$ROUNDS" "$ir" "$checksum" >> "$RESULTS"
          }

          measure d-base "$D_BASE" normal bench_ring_normal
          measure d-base "$D_BASE" over bench_ring_over
          measure d "$D" normal bench_ring_normal
          measure d "$D" over bench_ring_over
          measure cpp "$CPP" normal bench_ring_normal_native
          measure cpp "$CPP" native bench_ring_over_native
          measure cpp "$CPP" dynamic bench_ring_over_dynamic

          cat "$RESULTS"

          {
            echo '### ${{ matrix.name }} — v0.1.1 candidate'
            echo
            echo '| Toolchain | Variant | Rounds | Ir | Ir/round |'
            echo '|---|---|---:|---:|---:|'
            awk -F '\t' 'NR > 1 {
              printf "| %s | %s | %s | %s | %.6f |\n",
                $1, $2, $3, $4, $4 / $3
            }' "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-ring-hotfix-${{ matrix.compiler }}
          path: |
            build/perf-static-ring-hotfix/results.tsv
            build/perf-static-ring-hotfix/callgrind-*.out
          if-no-files-found: error
