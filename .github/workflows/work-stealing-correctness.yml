name: Work-Stealing Correctness

on:
  pull_request:
    branches:
      - develop
    paths:
      - source/containers/research/work_stealing_deque.d
      - tests/work-stealing-correctness/**
      - .github/workflows/work-stealing-correctness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-x86:
    name: x86_64 correctness / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Compiler versions
        shell: bash
        run: |
          "$DC" --version
          dub --version
          uname -a
          uname -m

      - name: Concurrent correctness
        shell: bash
        run: |
          DFLAGS="-version=ContainersWorkStealingResearchProbe" \
            dub run \
              --root=tests/work-stealing-correctness \
              --compiler="$DC" \
              --force

      - name: Concurrent correctness with DIP1000
        shell: bash
        run: |
          DFLAGS="-preview=dip1000 -version=ContainersWorkStealingResearchProbe" \
            dub run \
              --root=tests/work-stealing-correctness \
              --compiler="$DC" \
              --force
