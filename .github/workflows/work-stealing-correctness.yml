name: Work-Stealing Correctness

on:
  pull_request:
    branches:
      - develop
    paths:
      - source/containers/research/work_stealing_deque.d
      - source/containers/work_stealing_deque.d
      - source/containers/package.d
      - tests/work-stealing-correctness/**
      - tests/work-stealing-consumer/**
      - .github/workflows/work-stealing-correctness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-x86:
    name: x86_64 correctness / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Compiler versions
        shell: bash
        run: |
          "$DC" --version
          dub --version
          uname -a
          uname -m

      - name: Concurrent correctness
        shell: bash
        run: |
          dub run \
            --root=tests/work-stealing-correctness \
            --compiler="$DC" \
            --force

      - name: Concurrent correctness with DIP1000
        shell: bash
        run: |
          DFLAGS="-preview=dip1000" \
            dub run \
              --root=tests/work-stealing-correctness \
              --compiler="$DC" \
              --force

      - name: External candidate consumer
        shell: bash
        run: |
          dub run \
            --root=tests/work-stealing-consumer \
            --compiler="$DC" \
            --force

      - name: External candidate consumer with DIP1000
        shell: bash
        run: |
          DFLAGS="-preview=dip1000" \
            dub run \
              --root=tests/work-stealing-consumer \
              --compiler="$DC" \
              --force

      - name: Negative identity and element compile gates
        shell: bash
        run: |
          for root in \
            tests/compile-negative/work-stealing-copy \
            tests/compile-negative/work-stealing-assign \
            tests/compile-negative/work-stealing-pass-by-value \
            tests/compile-negative/work-stealing-move \
            tests/compile-negative/work-stealing-unsupported-element \
            tests/compile-negative/work-stealing-postblit-element \
            tests/compile-negative/work-stealing-unshared-pointer
          do
            if dub build \
                --root="$root" \
                --compiler="$DC" \
                --force; then
              echo "Expected work-stealing contract violation to fail: $root"
              false
            fi
          done
