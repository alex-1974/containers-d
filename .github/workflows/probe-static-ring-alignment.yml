name: Static Ring Alignment Probe

on:
  pull_request:
    branches:
      - develop
    paths:
      - benchmarks/static_ring_alignment_probe.d
      - source/containers/ring_buffer.d
      - source/containers/internal/inline_storage.d
      - source/containers/internal/target_capabilities.d
      - .github/workflows/probe-static-ring-alignment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alignment:
    name: Alignment / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DMD 2.111.0 / Linux x86_64
            id: dmd-2.111.0-linux-x86_64
            os: ubuntu-24.04
            compiler: dmd-2.111.0
          - name: DMD 2.112.1 / Linux x86_64
            id: dmd-2.112.1-linux-x86_64
            os: ubuntu-24.04
            compiler: dmd-2.112.1
          - name: DMD 2.113.0 / Linux x86_64
            id: dmd-2.113.0-linux-x86_64
            os: ubuntu-24.04
            compiler: dmd-2.113.0
          - name: LDC 1.41.0 / Linux x86_64
            id: ldc-1.41.0-linux-x86_64
            os: ubuntu-24.04
            compiler: ldc-1.41.0
          - name: LDC 1.42.0 / Linux x86_64
            id: ldc-1.42.0-linux-x86_64
            os: ubuntu-24.04
            compiler: ldc-1.42.0
          - name: LDC 1.43.0 / Linux x86_64
            id: ldc-1.43.0-linux-x86_64
            os: ubuntu-24.04
            compiler: ldc-1.43.0
          - name: LDC 1.41.0 / Linux AArch64
            id: ldc-1.41.0-linux-aarch64
            os: ubuntu-24.04-arm
            compiler: ldc-1.41.0
          - name: LDC 1.42.0 / Linux AArch64
            id: ldc-1.42.0-linux-aarch64
            os: ubuntu-24.04-arm
            compiler: ldc-1.42.0
          - name: LDC 1.43.0 / Linux AArch64
            id: ldc-1.43.0-linux-aarch64
            os: ubuntu-24.04-arm
            compiler: ldc-1.43.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Platform and compiler information
        shell: bash
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a || true
          echo "DC=$DC"
          "$DC" --version

      - name: Build probe
        shell: bash
        run: |
          mkdir -p build/alignment-probe
          "$DC" \
            -Isource \
            -of=build/alignment-probe/static-ring-alignment-probe \
            benchmarks/static_ring_alignment_probe.d \
            source/containers/ring_buffer.d \
            source/containers/internal/element_lifetime.d \
            source/containers/internal/inline_storage.d \
            source/containers/internal/target_capabilities.d

      - name: Run probe
        shell: bash
        run: |
          build/alignment-probe/static-ring-alignment-probe | tee build/alignment-probe/result.txt
          echo '### ${{ matrix.name }} — static ring alignment' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' build/alignment-probe/result.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Over-aligned inline-storage GC reachability
        shell: bash
        run: dub run --root=tests/inline-storage-gc --compiler="$DC" --force

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-ring-alignment-${{ matrix.id }}
          path: build/alignment-probe/result.txt
          if-no-files-found: error
