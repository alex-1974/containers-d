name: Static Inline Alignment Performance Probe

on:
  pull_request:
    branches:
      - develop
    paths:
      - benchmarks/static_inline_alignment_perf_probe.d
      - benchmarks/static_inline_alignment_perf_reference.cpp
      - source/containers/internal/inline_storage.d
      - source/containers/internal/target_capabilities.d
      - .github/workflows/perf-static-inline-alignment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instruction-counts:
    name: Alignment Ir / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DMD 2.111.0 / Linux x86_64
            id: dmd-2.111.0-linux-x86_64
            os: ubuntu-24.04
            compiler: dmd-2.111.0
          - name: DMD 2.112.1 / Linux x86_64
            id: dmd-2.112.1-linux-x86_64
            os: ubuntu-24.04
            compiler: dmd-2.112.1
          - name: DMD 2.113.0 / Linux x86_64
            id: dmd-2.113.0-linux-x86_64
            os: ubuntu-24.04
            compiler: dmd-2.113.0
          - name: LDC 1.41.0 / Linux x86_64
            id: ldc-1.41.0-linux-x86_64
            os: ubuntu-24.04
            compiler: ldc-1.41.0
          - name: LDC 1.42.0 / Linux x86_64
            id: ldc-1.42.0-linux-x86_64
            os: ubuntu-24.04
            compiler: ldc-1.42.0
          - name: LDC 1.43.0 / Linux x86_64
            id: ldc-1.43.0-linux-x86_64
            os: ubuntu-24.04
            compiler: ldc-1.43.0
          - name: LDC 1.41.0 / Linux AArch64
            id: ldc-1.41.0-linux-aarch64
            os: ubuntu-24.04-arm
            compiler: ldc-1.41.0
          - name: LDC 1.43.0 / Linux AArch64
            id: ldc-1.43.0-linux-aarch64
            os: ubuntu-24.04-arm
            compiler: ldc-1.43.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Install Callgrind
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Toolchain information
        shell: bash
        run: |
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "DC=$DC"
          "$DC" --version
          clang++ --version
          valgrind --version

      - name: Build D and C++ probes
        shell: bash
        run: |
          mkdir -p build/perf-static-inline-alignment

          case "${{ matrix.compiler }}" in
            dmd-*)
              "$DC" \
                -O \
                -release \
                -inline \
                -boundscheck=off \
                -Isource \
                -of=build/perf-static-inline-alignment/d-probe \
                benchmarks/static_inline_alignment_perf_probe.d \
                source/containers/internal/inline_storage.d \
                source/containers/internal/target_capabilities.d
              ;;
            ldc-*)
              "$DC" \
                -O3 \
                -release \
                -boundscheck=off \
                -Isource \
                -of=build/perf-static-inline-alignment/d-probe \
                benchmarks/static_inline_alignment_perf_probe.d \
                source/containers/internal/inline_storage.d \
                source/containers/internal/target_capabilities.d
              ;;
          esac

          clang++ \
            -std=c++20 \
            -O3 \
            -DNDEBUG \
            -fno-exceptions \
            -fno-rtti \
            benchmarks/static_inline_alignment_perf_reference.cpp \
            -o build/perf-static-inline-alignment/cpp-probe

      - name: Verify semantic equivalence
        shell: bash
        run: |
          D=build/perf-static-inline-alignment/d-probe
          CPP=build/perf-static-inline-alignment/cpp-probe
          ROUNDS=64

          d_imported_normal=$("$D" imported-normal "$ROUNDS" | awk '{print $2}')
          d_imported_over=$("$D" imported-over "$ROUNDS" | awk '{print $2}')
          d_local_normal=$("$D" local-normal "$ROUNDS" | awk '{print $2}')
          d_local_over=$("$D" local-over "$ROUNDS" | awk '{print $2}')
          cpp_normal=$("$CPP" normal "$ROUNDS" | awk '{print $2}')
          cpp_native=$("$CPP" native "$ROUNDS" | awk '{print $2}')
          cpp_dynamic=$("$CPP" dynamic "$ROUNDS" | awk '{print $2}')

          printf 'd_imported_normal=%s d_imported_over=%s d_local_normal=%s d_local_over=%s cpp_normal=%s cpp_native=%s cpp_dynamic=%s\n' \
            "$d_imported_normal" "$d_imported_over" \
            "$d_local_normal" "$d_local_over" \
            "$cpp_normal" "$cpp_native" "$cpp_dynamic"

          # The locally generated candidate is the active experiment and must
          # remain semantically equivalent to both C++ references.
          test "$d_local_normal" = "$d_local_over"
          test "$d_local_normal" = "$cpp_normal"
          test "$d_local_normal" = "$cpp_native"
          test "$d_local_normal" = "$cpp_dynamic"

          # Imported-storage mismatches are preserved as research evidence
          # instead of hiding the DMD 2.112+ optimizer finding.
          if [ "$d_imported_normal" = "$cpp_normal" ] &&
             [ "$d_imported_over" = "$cpp_native" ]; then
            echo "imported_semantic=PASS"
          else
            echo "imported_semantic=FAIL"
          fi

      - name: Measure retired instructions
        shell: bash
        run: |
          D=build/perf-static-inline-alignment/d-probe
          CPP=build/perf-static-inline-alignment/cpp-probe
          ROUNDS=4096
          OPERATIONS=$((ROUNDS * 256))
          RESULTS=build/perf-static-inline-alignment/results.tsv

          printf 'toolchain\tvariant\toperations\tIr\tchecksum\n' > "$RESULTS"

          measure() {
            toolchain="$1"
            binary="$2"
            variant="$3"
            symbol="$4"
            out="build/perf-static-inline-alignment/callgrind-${toolchain}-${variant}.out"

            checksum=$("$binary" "$variant" "$ROUNDS" | awk '{print $2}')

            valgrind \
              --tool=callgrind \
              --collect-atstart=no \
              --toggle-collect="$symbol" \
              --callgrind-out-file="$out" \
              "$binary" "$variant" "$ROUNDS" \
              >/dev/null 2>&1

            ir=$(awk '/^summary:/ {print $2}' "$out")

            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$toolchain" "$variant" "$OPERATIONS" "$ir" "$checksum" \
              >> "$RESULTS"
          }

          imported_normal=$("$D" imported-normal 64 | awk '{print $2}')
          imported_over=$("$D" imported-over 64 | awk '{print $2}')
          cpp_reference=$("$CPP" normal 64 | awk '{print $2}')

          if [ "$imported_normal" = "$cpp_reference" ]; then
            measure d-imported "$D" imported-normal bench_imported_normal
          else
            echo "skip imported-normal Callgrind: semantic mismatch"
          fi

          if [ "$imported_over" = "$cpp_reference" ]; then
            measure d-imported "$D" imported-over bench_imported_over
          else
            echo "skip imported-over Callgrind: semantic mismatch"
          fi

          measure d-local "$D" local-normal bench_local_normal
          measure d-local "$D" local-over bench_local_over
          measure cpp "$CPP" normal bench_normal_native
          measure cpp "$CPP" native bench_over_native
          measure cpp "$CPP" dynamic bench_over_dynamic

          cat "$RESULTS"

          {
            echo '### ${{ matrix.name }} — static inline alignment counts'
            echo
            echo '| Toolchain | Variant | Operations | Ir | Ir/op |'
            echo '|---|---|---:|---:|---:|'
            awk -F '\t' 'NR > 1 {
              printf "| %s | %s | %s | %s | %.6f |\n",
                $1, $2, $3, $4, $4 / $3
            }' "$RESULTS"
            echo
            awk -F '\t' '
              $1 == "d-local" && $2 == "local-normal" { dn=$4 }
              $1 == "d-local" && $2 == "local-over" { dover=$4 }
              $1 == "cpp" && $2 == "normal" { cn=$4 }
              $1 == "cpp" && $2 == "native" { cna=$4 }
              $1 == "cpp" && $2 == "dynamic" { cdy=$4 }
              END {
                printf "D local normal vs C++ normal: %+.6f%%\n", (dn-cn)*100.0/cn
                printf "D local over vs C++ native: %+.6f%%\n", (dover-cna)*100.0/cna
                printf "D local over vs C++ dynamic: %+.6f%%\n", (dover-cdy)*100.0/cdy
              }
            ' "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-inline-alignment-${{ matrix.id }}
          path: |
            build/perf-static-inline-alignment/results.tsv
            build/perf-static-inline-alignment/callgrind-*.out
          if-no-files-found: error
