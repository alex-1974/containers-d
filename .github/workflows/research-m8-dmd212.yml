name: M8 DMD 2.112 Reproducer

on:
  push:
    branches:
      - research/m8-nested-elements
    paths:
      - .github/workflows/research-m8-dmd212.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primitive-matrix:
    name: Primitive matrix / dmd-2.112.1
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install DMD 2.112.1
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-2.112.1

      - name: Run primitive probe matrix
        shell: bash
        run: |
          bash experiments/m8_nested_elements/run_matrix.sh \
            build/research/m8-nested-elements-dmd212

      - name: Upload primitive results
        uses: actions/upload-artifact@v7
        with:
          name: m8-nested-elements-dmd-2.112.1-reproducer
          path: build/research/m8-nested-elements-dmd212
          if-no-files-found: error
