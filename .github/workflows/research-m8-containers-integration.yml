name: M8 Containers Integration

on:
  push:
    branches:
      - research/m8-nested-elements
    paths:
      - experiments/m8_nested_elements/integration/**
      - .github/workflows/research-m8-containers-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m8-containers-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - dmd-2.112.1
          - dmd-2.113.0
          - ldc-1.41.0
          - ldc-1.42.0
          - ldc-1.43.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Run containers integration matrix
        shell: bash
        run: |
          bash experiments/m8_nested_elements/integration/run.sh \
            build/research/m8-nested-integration

      - name: Upload integration results
        uses: actions/upload-artifact@v7
        with:
          name: m8-integration-${{ matrix.compiler }}
          path: build/research/m8-nested-integration
          if-no-files-found: error
