name: Bug
description: Report incorrect container behaviour
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behaviour and the expected contract.
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
    validations:
      required: true

  - type: textarea
    id: toolchain
    attributes:
      label: Toolchain
      description: DMD/LDC and DUB versions.
    validations:
      required: true
